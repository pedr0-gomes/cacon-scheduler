<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acesso — CACON</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      padding: 48px 40px;
      width: 100%;
      max-width: 360px;
      text-align: center;
    }
    .logo {
      font-size: 13px;
      font-weight: 600;
      color: #6b7280;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 32px;
    }
    label {
      display: block;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    input[type="password"] {
      width: 100%;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
    }
    input[type="password"]:focus { border-color: #1a1a2e; }
    .erro {
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 20px;
      text-align: left;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: #1a1a2e;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2d2d4e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">CACON</div>
    <h1>Triagem e Agendamento</h1>

    {% if erro %}
    <div class="erro">Senha incorreta. Tente novamente.</div>
    {% endif %}

    <form method="post" action="/login">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autofocus autocomplete="current-password">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
