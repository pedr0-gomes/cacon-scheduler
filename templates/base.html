<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CACON{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f6fa;
      color: #1a1a2e;
      font-size: 16px;
      line-height: 1.45;
    }

    /* NAV */
    nav {
      background: #1a1a2e;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 0;
    }
    .nav-brand {
      color: #fff;
      font-weight: 700;
      font-size: 18px;
      padding: 16px 28px 16px 0;
      letter-spacing: .5px;
    }
    nav a {
      color: #aab4c8;
      text-decoration: none;
      padding: 18px 22px;
      display: inline-block;
      font-size: 17px;
      font-weight: 600;
      transition: color .15s, background .15s;
    }
    nav a:hover { color: #fff; background: rgba(255,255,255,.07); }
    nav a.ativo { color: #fff; border-bottom: 3px solid #4e9af1; }

    /* LAYOUT */
    .container { max-width: 1240px; margin: 0 auto; padding: 28px 24px; }
    .container.largo { max-width: none; padding: 16px 20px; }

    h1 { font-size: 28px; font-weight: 800; margin-bottom: 2px; }
    h2 { font-size: 21px; font-weight: 700; margin-bottom: 14px; color: #1a1a2e; }
    .subtitulo { color: #4b5563; font-size: 16px; margin-bottom: 22px; }
    .topo { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
    .topo .subtitulo { margin-bottom: 0; }
    .nota { font-size: 15px; color: #4b5563; margin-bottom: 14px; }

    /* CARD */
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      margin-bottom: 24px;
    }

    /* FORM */
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    label { font-size: 15px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
    input[type=text], input[type=time], input[type=date], input[type=number], select {
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      background: #fff;
      width: 100%;
    }
    input:focus, select:focus { border-color: #4e9af1; }
    input[type=time] { width: auto; min-width: 120px; }
    .field { flex: 1; min-width: 180px; }
    .field-largo { flex: 2; min-width: 260px; }

    /* BOTÕES */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 11px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: #4e9af1; color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-danger { background: #ef4444; color: #fff; }
    .btn-danger:hover { opacity: .9; }
    .btn-ghost { background: #f3f4f6; color: #374151; }
    .btn-ghost:hover { background: #e5e7eb; }
    .btn-sm { padding: 8px 14px; font-size: 15px; }
    .btn-lg { padding: 14px 26px; font-size: 18px; }
    .btn-verde { background: #16a34a; color: #fff; }
    .link-remover { background: none; border: none; color: #b91c1c; font-size: 15px; cursor: pointer; text-decoration: underline; padding: 4px; }
    .btn-evento {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn-evento:active { transform: scale(.96); }
    .btn-evento:disabled { opacity: .35; cursor: default; }

    /* BADGES DE COR */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 700;
    }
    .badge-verde    { background: #d1fae5; color: #065f46; }
    .badge-azul     { background: #dbeafe; color: #1e40af; }
    .badge-amarelo  { background: #fef9c3; color: #854d0e; }
    .badge-vermelho { background: #fee2e2; color: #991b1b; }

    /* TABELA DE AGENDA */
    .tabela-agenda { width: 100%; border-collapse: collapse; }
    .tabela-agenda th {
      text-align: left;
      font-size: 14px;
      font-weight: 700;
      color: #4b5563;
      padding: 10px 14px;
      border-bottom: 2px solid #f3f4f6;
    }
    .tabela-agenda td {
      padding: 12px 14px;
      border-bottom: 1px solid #eef0f3;
      font-size: 16px;
      vertical-align: middle;
    }
    .tabela-agenda tr:last-child td { border-bottom: none; }
    .tabela-agenda tr:hover td { background: #fafbfc; }
    .row-verde    td:first-child { border-left: 4px solid #10b981; }
    .row-azul     td:first-child { border-left: 4px solid #3b82f6; }
    .row-amarelo  td:first-child { border-left: 4px solid #f59e0b; }
    .row-vermelho td:first-child { border-left: 4px solid #ef4444; }

    .hora { font-weight: 800; font-size: 20px; color: #1a1a2e; }
    .sub { display: block; font-size: 14px; color: #6b7280; font-weight: 400; }
    .poltrona-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 40px; height: 40px; padding: 0 6px;
      border-radius: 10px;
      background: #eef2ff;
      font-weight: 800;
      font-size: 18px;
      color: #374151;
    }

    /* REGISTRO */
    .paciente-card {
      border-radius: 12px;
      border: 1.5px solid #e5e7eb;
      padding: 20px;
      margin-bottom: 16px;
      background: #fff;
      transition: border-color .2s;
    }
    .paciente-card.concluido { border-color: #10b981; background: #f0fdf4; }
    .paciente-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .paciente-nome { font-size: 16px; font-weight: 700; }
    .paciente-info { font-size: 13px; color: #6b7280; }

    .eventos-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 600px) {
      .eventos-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .evento-bloco { text-align: center; }
    .evento-label { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
    .evento-hora  { font-size: 13px; font-weight: 700; color: #1a1a2e; margin-top: 6px; }

    .btn-puncao       { background: #fee2e2; color: #991b1b; }
    .btn-preqt        { background: #fef3c7; color: #854d0e; }
    .btn-qt           { background: #dbeafe; color: #1e40af; }
    .btn-retirada     { background: #dbeafe; color: #1e40af; }
    .btn-higienizacao { background: #d1fae5; color: #065f46; }
    .btn-feito        { background: #f3f4f6; color: #6b7280; font-size: 13px; }

    /* PAINEL DE POLTRONAS — cabe inteiro na tela: 10 colunas × 4 linhas */
    .painel-grid {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      grid-auto-rows: minmax(118px, calc((100vh - 150px) / 4 - 10px));
      gap: 10px;
    }
    @media (max-width: 1000px) {
      .painel-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); grid-auto-rows: 130px; }
    }
    .chair-card {
      position: relative;
      border-radius: 14px;
      border: 2.5px solid #e5e7eb;
      padding: 10px 8px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform .1s, box-shadow .15s;
      user-select: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }
    .chair-card:active { transform: scale(.96); }
    .chair-card:hover  { box-shadow: 0 4px 14px rgba(0,0,0,.15); }

    .chair-top    { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
    .chair-num    { font-size: 30px; font-weight: 800; line-height: 1; }
    .chair-nome   { font-size: 18px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chair-status { font-size: 15px; font-weight: 700; }
    .chair-hora   { font-size: 15px; font-weight: 600; }
    .chair-livre .chair-status { font-size: 14px; font-weight: 500; }
    .chair-bar-wrap {
      margin-top: 6px;
      height: 10px;
      background: rgba(0,0,0,.10);
      border-radius: 5px;
      overflow: hidden;
    }
    .chair-bar-fill {
      height: 100%;
      background: currentColor;
      opacity: .80;
      width: 0%;
      transition: width .5s;
    }

    /* VITALS BAR */
    .vitals-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .vital-item {
      background: #fff;
      border-radius: 12px;
      padding: 16px 12px 14px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .vital-num   { font-size: 34px; font-weight: 800; line-height: 1; color: #1a1a2e; }
    .vital-label { font-size: 11px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }

    /* Cores por etapa */
    .chair-livre                   { background: #ffffff; border-color: #e5e7eb; color: #9ca3af; }
    .chair-aguardando_puncao       { background: #fef9c3; border-color: #eab308; color: #713f12; }
    .chair-aguardando_preqt        { background: #ffedd5; border-color: #f97316; color: #9a3412; }
    .chair-aguardando_qt           { background: #dbeafe; border-color: #60a5fa; color: #1e40af; }
    .chair-aguardando_retirada     { background: #ede9fe; border-color: #7c3aed; color: #5b21b6; }
    .chair-aguardando_higienizacao { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    .chair-concluida               { background: #ffffff; border-color: #e5e7eb; color: #9ca3af; }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000;
      padding: 16px;
    }
    .modal-box {
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      width: 100%; max-width: 620px;
      max-height: 92vh; overflow-y: auto;
      box-shadow: 0 8px 40px rgba(0,0,0,.22);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
    }
    .modal-title { font-size: 22px; font-weight: 800; }
    .modal-close {
      background: #f3f4f6; border: none; border-radius: 50%;
      width: 36px; height: 36px; font-size: 20px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .m-nome     { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
    .m-info     { font-size: 16px; color: #4b5563; margin-bottom: 2px; }
    .m-alerta   {
      background: #fef9c3; border: 1.5px solid #f59e0b;
      border-radius: 8px; padding: 10px 14px;
      font-size: 14px; font-weight: 600; color: #92400e;
      margin: 12px 0;
    }
    .m-progress-wrap {
      background: #e5e7eb; border-radius: 10px;
      overflow: hidden; height: 22px; margin: 18px 0 6px;
    }
    .m-progress-bar { height: 100%; background: #3b82f6; transition: width .5s; }
    .m-progress-label { font-size: 17px; font-weight: 700; color: #1a1a2e; margin-bottom: 16px; }
    .btn-acao {
      width: 100%; padding: 20px;
      border: none; border-radius: 14px;
      font-size: 20px; font-weight: 800;
      cursor: pointer; margin: 16px 0 10px;
      transition: opacity .15s, transform .1s;
    }
    .btn-acao:active { transform: scale(.97); }
    .m-eventos-list {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px;
    }
    .ev-feito   { font-size: 16px; background: #d1fae5; color: #065f46; padding: 8px 14px; border-radius: 20px; font-weight: 700; }
    .ev-pendente{ font-size: 16px; background: #f3f4f6; color: #6b7280; padding: 8px 14px; border-radius: 20px; font-weight: 600; }
    .m-livre    { text-align: center; padding: 40px; color: #9ca3af; font-size: 16px; }
    .m-anotar   { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
    .m-anotar input {
      width: 100%; padding: 10px 14px;
      border: 1.5px solid #d1d5db; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    .m-anotar input:focus { border-color: #f59e0b; }
    .m-anotar button { align-self: flex-end; }

    /* RESUMO */
    .resumo-bar {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      align-items: center;
      padding: 16px 20px;
      background: #fff;
      border-radius: 10px;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .resumo-item { text-align: center; }
    .resumo-num  { font-size: 26px; font-weight: 800; color: #1a1a2e; }
    .resumo-desc { font-size: 12px; color: #6b7280; }

    /* LISTA DE PACIENTES ADICIONADOS */
    .lista-pac { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .lista-pac li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      background: #fafafa;
    }
    .lista-pac .pac-nome { font-weight: 600; flex: 1; }
    .lista-pac .pac-prot { font-size: 12px; color: #6b7280; }
    .badge-pre {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      background: #f3f4f6;
      color: #374151;
      white-space: nowrap;
    }

    /* PRINT */
    @media print {
      nav, .no-print { display: none !important; }
      body { background: #fff; }
      .card { box-shadow: none; border: 1px solid #ddd; }
    }

    /* UTILS */
    .mt-16 { margin-top: 16px; }
    .flex { display: flex; }
    .gap-8 { gap: 8px; }
    .empty { text-align: center; color: #6b7280; padding: 32px 0; font-size: 17px; }
  </style>
</head>
<body>
  {% block nav %}
  <nav>
    <span class="nav-brand">CACON</span>
    <a href="/" class="{% if request.url.path == '/' %}ativo{% endif %}">Hoje</a>
    <a href="/painel" class="{% if request.url.path == '/painel' %}ativo{% endif %}">Salão</a>
    <a href="/lista" class="{% if request.url.path == '/lista' %}ativo{% endif %}">Agenda</a>
    <a href="/relatorio" class="{% if request.url.path == '/relatorio' %}ativo{% endif %}">Relatório</a>
    <a href="/configuracao" style="margin-left:auto; font-size:15px;" class="{% if request.url.path.startswith('/configuracao') or request.url.path == '/auditoria' %}ativo{% endif %}">⚙ Configuração</a>
    <a href="/logout" style="color:#fca5a5; font-size:15px;">Sair</a>
  </nav>
  {% endblock %}

  <div class="container {% block container_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
